<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="avatarShape" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Outer circle background -->
  <rect width="200" height="200" rx="100" fill="url(#avatarBg)"/>
  
  <!-- Inner circular border ring -->
  <circle cx="100" cy="100" r="94" fill="none" stroke="#334155" stroke-width="3"/>
  
  <!-- Head -->
  <circle cx="100" cy="74" r="34" fill="url(#avatarShape)" filter="url(#shadow)"/>
  
  <!-- Torso / Shoulders -->
  <path d="M 40 172 C 40 134, 66 122, 100 122 C 134 122, 160 134, 160 172 C 160 176, 158 180, 154 182 C 138 193, 120 200, 100 200 C 80 200, 62 193, 46 182 C 42 180, 40 176, 40 172 Z" fill="url(#avatarShape)" filter="url(#shadow)"/>
</svg>
